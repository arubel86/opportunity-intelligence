server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ocultar versión del servidor Nginx (Informational Disclosure)
    server_tokens off;

    # Cabeceras de Seguridad HTTP Globales (Defensa contra Clickjacking, Sniffing y Fuga de Referer)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Clean URLs Routing (con o sin barra final /)
    location ~ ^/catalogo/avaluo-autos(\.html)?/?$ {
        try_files /catalogo/avaluo-autos.html /avaluo-autos.html =404;
    }

    location ~ ^/catalogo/avaluo-propiedades(\.html)?/?$ {
        try_files /catalogo/avaluo-propiedades.html /avaluo-propiedades.html =404;
    }

    location ~ ^/avaluo-autos(\.html)?/?$ {
        try_files /avaluo-autos.html /catalogo/avaluo-autos.html =404;
    }

    location ~ ^/avaluo-propiedades(\.html)?/?$ {
        try_files /avaluo-propiedades.html /catalogo/avaluo-propiedades.html =404;
    }

    location ~ ^/catalogo/?$ {
        try_files /catalogo/index.html /catalogo.html =404;
    }

    location ~ ^/login/?$ {
        try_files /login.html =404;
    }

    location ~ ^/dashboard/?$ {
        try_files /index.html =404;
    }

    location ~ ^/propiedades/?$ {
        try_files /landing1.html =404;
    }

    location ~ ^/autos/?$ {
        try_files /landing2.html =404;
    }

    location ~ ^/landings/landing1/?$ {
        try_files /landing1.html =404;
    }

    location ~ ^/landings/landing2/?$ {
        try_files /landing2.html =404;
    }

    location ~ ^/landing1/?$ {
        try_files /landing1.html =404;
    }

    location ~ ^/landing2/?$ {
        try_files /landing2.html =404;
    }

    location ~ ^/landing-1/?$ {
        try_files /landing1.html =404;
    }

    location ~ ^/landing-2/?$ {
        try_files /landing2.html =404;
    }

    # Fallback to SPA / Root
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
